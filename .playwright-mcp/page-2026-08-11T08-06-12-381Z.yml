    - generic [ref=f1e278]:
      - paragraph [ref=f1e279]: 09 — What broke
      - heading "Five ways this reported success while handing me the wrong thing" [level=2] [ref=f1e280]
      - paragraph [ref=f1e281]: None of these crashed. Every one of them ran to completion and gave me something that looked like a result.
      - heading "A deduplication step that deleted the corpus" [level=3] [ref=f1e282]
      - paragraph [ref=f1e283]: Documents were deduplicated by hashing their first 200 characters. Web pages share navigation boilerplate, so thousands of distinct articles hashed identically. A 20,000-token target came out as 109 tokens. Hashing the whole document fixed it. A unit test caught this, not a person.
      - heading "A config I edited but never uploaded" [level=3] [ref=f1e284]
      - paragraph [ref=f1e285]:
        - text: I changed the training length, then launched two 11-hour runs — from the copy that was still sitting on the server. Both runs used the old schedule. They are still
        - emphasis [ref=f1e286]: valid
        - text: ", because both arms were equally affected, but the config file in the repo no longer described what ran. Editing a file is not deploying it."
      - paragraph [ref=f1e287]: The fix was to set the configs to what actually ran rather than what I meant, and write a comment explaining why the obvious-looking value must not be "corrected". Seed 2 then had to reproduce the same schedule exactly, or the seed-to-seed spread would have absorbed a config change and stopped measuring noise.
      - heading "…and then a second bug caused by fixing the first" [level=3] [ref=f1e288]
      - paragraph [ref=f1e289]: "That config field was read by two different things: the learning-rate schedule and the runner's \"is this run finished?\" test. Pinning it for the schedule made a completed 60,000-step run look 12,000 steps short, and the runner launched a pointless continuation. An assert at the top of the training notebook caught it in 55 seconds instead of after hours of compute."
      - heading "A file pattern that matched two files" [level=3] [ref=f1e290]
      - paragraph [ref=f1e291]:
        - text: Every saved run contains a full copy of the repository, so a search for
        - code [ref=f1e292]: pyproject.toml
        - text: found both the repo and the previous run's embedded copy. The fix was to scope each lookup to where the thing legitimately lives, making the ambiguity impossible rather than merely detected.
      - heading "A wrong diagnosis, stated confidently" [level=3] [ref=f1e293]
      - paragraph [ref=f1e294]: When mounted files first went missing I blamed a race condition and said so. It was a wrong path. Running one command that listed the directory would have shown that immediately. A confident wrong diagnosis costs more than saying "checking."
