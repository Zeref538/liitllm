      - paragraph [ref=f1e147]: The 512-token context is a deliberate choice for this subject. Code-switching is a discourse-level behaviour — a writer flips register across clauses and sentences, not within a three-word window. At 256 tokens the model would rarely see a full switch cycle.
      - generic [ref=f1e148]:
        - paragraph [ref=f1e149]: One tokenizer, trained on the unfiltered corpus
        - paragraph [ref=f1e150]:
          - text: Both arms share a byte-level BPE tokenizer, and it is trained on the
          - emphasis [ref=f1e151]: unfiltered
          - text: text on purpose. Training it on the filtered corpus would tune the vocabulary to the filtered model's own distribution and hand that arm an advantage that has nothing to do with the experiment. The two data-prep runs ran on two different accounts a day apart and produced byte-identical tokenizers, which is the check that this was actually deterministic rather than merely intended to be.
    - generic [ref=f1e152]:
      - paragraph [ref=f1e153]: 05 — Surviving the clock
      - heading "Four 11-hour runs on a service that kills you at 12" [level=2] [ref=f1e154]
      - paragraph [ref=f1e155]: The free GPU I used stops every session at 12 hours, whether or not you are done. Each run needs about 11. There is no room for a crash, and a crash at hour 10 that loses everything is not a setback, it is the end of the project.
      - heading "What makes an 11-hour run survivable" [level=3] [ref=f1e156]
      - list [ref=f1e157]:
        - listitem [ref=f1e158]:
          - text: Atomic checkpoints. Write to a temp file, then
          - code [ref=f1e159]: os.replace
          - text: onto the target, keeping the previous one as a fallback. A crash mid-write otherwise truncates the only copy you have.
        - listitem [ref=f1e160]: Random state is saved too. Without it, a resumed run replays the same batches it already learned from and quietly trains on a shorter corpus than you think.
        - listitem [ref=f1e161]:
          - text: A wall-clock guard. The loop stops itself at 11 hours and checkpoints cleanly, so
          - emphasis [ref=f1e162]: I
          - text: choose when the session ends rather than the platform choosing mid-write.
        - listitem [ref=f1e163]: A runner that assumes it will die. Re-running the entrypoint skips finished work and resumes partial work. It also detects the specific case where a run finished on the server but its output was never downloaded — which is what happens every time the laptop sleeps.
        - listitem [ref=f1e164]: A lockfile. Two runners once raced and pushed the same job 18 seconds apart, burning double the GPU on identical work.
      - paragraph [ref=f1e165]: "The last run made the case for all of it: it stopped at step 55,000 instead of 60,000. The runner noticed, pushed a continuation from the last checkpoint, finished the remaining 5,000 steps, and moved on to scoring — with nobody awake."
