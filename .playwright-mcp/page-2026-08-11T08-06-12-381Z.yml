  - banner [ref=f1e9]:
    - paragraph [ref=f1e10]: Case study — from-scratch language model
    - heading "Every big corpus throws Taglish away. This one keeps only Taglish." [level=1] [ref=f1e11]: Every big corpus throws Taglish away.This one keeps only Taglish.
    - paragraph [ref=f1e12]:
      - text: "Filipinos online don't write pure Tagalog or pure English — they switch between them mid-sentence. The tools that assemble training data for large language models treat that mixing as garbage and delete it. I built the opposite: a filter that keeps"
      - emphasis [ref=f1e13]: only
      - text: the mixed writing, trained a small model on it, and then trained an identical model on unfiltered text to prove the filter is what made the difference.
