  - main [ref=f1e44]:
    - generic [ref=f1e45]:
      - paragraph [ref=f1e46]: 01 — The premise
      - heading "A filter that calls the real language \"noise\"" [level=2] [ref=f1e47]
      - generic [ref=f1e48]:
        - paragraph [ref=f1e49]: To build a training set, you crawl the web and sort pages by language. A tool looks at each page and says "this is Tagalog" or "this is English." Pages it can't confidently label get thrown out.
        - paragraph [ref=f1e50]:
          - text: "Now consider how a Filipino actually writes:"
          - emphasis [ref=f1e51]: "\"Kahapon nag-commute ako papuntang office kasi grabe ang traffic.\""
          - text: The grammar is Tagalog. Half the nouns are English. The tool sees a page full of that, can't commit to either label, and deletes it.
        - paragraph [ref=f1e52]: So the register that millions of people actually write in is systematically absent from the data that language models learn from. Not by anyone's decision — as a side effect of a sorting step nobody thinks about.
    - generic [ref=f1e53]:
      - paragraph [ref=f1e54]: 02 — The scorer
      - heading "Two word lists and a rule about prefixes" [level=2] [ref=f1e55]
      - generic [ref=f1e56]:
        - paragraph [ref=f1e57]:
          - text: The filter is about thirty lines. It splits text into words and asks, for each one, "is this in my Tagalog list?" and "is this in my English list?" Then it keeps documents where
          - emphasis [ref=f1e58]: both
          - text: answers come back often enough.
        - paragraph [ref=f1e59]: Two details make it work, and both took a rewrite to find.
      - heading "The two lists are not symmetric" [level=3] [ref=f1e60]
      - paragraph [ref=f1e61]:
        - text: The Tagalog list is almost all function words —
        - code [ref=f1e62]: ang
        - text: ","
        - code [ref=f1e63]: ng
        - text: ","
        - code [ref=f1e64]: sa
        - text: ","
        - code [ref=f1e65]: kasi
        - text: ","
        - code [ref=f1e66]: naman
        - text: ". Those are a closed class: you cannot write Tagalog syntax without them, and English text will not accidentally produce them."
      - paragraph [ref=f1e67]:
        - text: The English list deliberately includes content words —
        - code [ref=f1e68]: office
        - text: ","
        - code [ref=f1e69]: traffic
        - text: ","
        - code [ref=f1e70]: meeting
        - text: ". That asymmetry is forced by the phenomenon itself: in"
        - emphasis [ref=f1e71]: "\"nag-commute ako sa office\""
        - text: there is not a single English function word. Score English by function words and the most characteristically Taglish sentences read as pure Tagalog.
      - heading "Hyphens get split, or the most Taglish word scores nothing" [level=3] [ref=f1e72]
      - paragraph [ref=f1e73]:
        - code [ref=f1e74]: nag-commute
        - text: matches neither list as a single token — and neither does
        - code [ref=f1e75]: nagcommute
        - text: ", because the affix stripper only finds a stem that is itself in the Tagalog list, and"
        - code [ref=f1e76]: commute
        - text: is English. So the single most characteristically Taglish word in the sentence would contribute zero to either side.
      - paragraph [ref=f1e77]:
        - text: "Splitting on the hyphen fixes half of that:"
        - code [ref=f1e78]: commute
        - text: lands in the English list. The
        - code [ref=f1e79]: nag-
        - text: half still scores nothing, since bare affixes are not lexicon entries. That is a real limitation, not a design choice — but it only ever
        - emphasis [ref=f1e80]: under
        - text: "-counts, and it under-counts the Tagalog side of a word already surrounded by Tagalog function words, so the document is not at risk of being misread as English."
      - generic [ref=f1e81]:
        - paragraph [ref=f1e82]: Morphology
        - paragraph [ref=f1e83]:
          - text: "Tagalog is agglutinative:"
          - code [ref=f1e84]: trabaho
          - text: becomes
          - code [ref=f1e85]: nagtrabaho
          - text: ","
          - code [ref=f1e86]: trabahuhan
          - text: ","
          - code [ref=f1e87]: pinagtrabahuhan
          - text: . A bare root list misses all of those and under-counts the Tagalog side. The scorer peels one prefix and one suffix, and handles reduplication (
          - code [ref=f1e88]: nagcocommute
          - text: →
          - code [ref=f1e89]: commute
          - text: ). It stops at one layer on purpose — two layers reduces
          - code [ref=f1e90]: nasa
          - text: to
          - code [ref=f1e91]: sa
          - text: and starts inventing matches.
    - generic [ref=f1e92]:
      - paragraph [ref=f1e93]: 03 — The finding that dented my own premise
      - heading "The web text was already 40% Taglish" [level=2] [ref=f1e94]
      - paragraph [ref=f1e95]: My whole pitch was that code-switching gets filtered out of web corpora. So I measured how much survives, expecting very little. Across 50,000 documents from each of two sources, 38% and 39.5% already passed the Taglish test — untouched, straight out of the corpus.
