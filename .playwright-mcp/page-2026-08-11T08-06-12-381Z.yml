      - heading "What it is, and what \"from scratch\" means" [level=2] [ref=f1e113]
      - paragraph [ref=f1e114]: No downloaded model, no fine-tuning. The tokenizer, the transformer, the training loop are code in this repository. The only things brought in from outside are the raw text and PyTorch itself.
