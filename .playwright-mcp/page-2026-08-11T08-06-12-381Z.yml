      - generic [ref=f1e105]:
        - paragraph [ref=f1e106]: This weakens the control arm, and it stays in
        - paragraph [ref=f1e107]: "The \"unfiltered\" model is supposed to be the contrast. But if its corpus is already ~40% code-switched, it is not a clean negative — it is a weaker dose, not a zero dose. The honest framing is not \"filtering creates code-switching from nothing.\" It is: Filipino web text is already heavily code-switched, and filtering the rest of the way still measurably changes the model. That is a smaller claim than I set out to make, and it is the one the data supports."
      - heading "An earlier version of this page would have said something false" [level=3] [ref=f1e108]
      - paragraph [ref=f1e109]:
        - text: "I first ran that bake-off on 2,000 documents and got 46.8% versus 34.4% — a clear win for FineWeb-2, and I wrote it down as one. At 50,000 documents it is 38.0% versus 39.5%: the two sources are equivalent and the ranking had"
        - emphasis [ref=f1e110]: inverted
        - text: . Small samples do not give you a quiet, proportional error. They give you a confident answer that is backwards.
