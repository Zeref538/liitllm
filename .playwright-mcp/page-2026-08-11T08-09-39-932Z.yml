  - main [ref=f2e44]:
    - generic [ref=f2e45]:
      - paragraph [ref=f2e46]: 01 — The premise
      - heading "Language ID is a document-level classifier, and Taglish is a sentence-level phenomenon" [level=2] [ref=f2e47]
      - generic [ref=f2e48]:
        - paragraph [ref=f2e49]: CC-100, OSCAR, FineWeb-2 and friends all route documents through a fastText langid classifier with a confidence floor. Intra-sentential code-switching — English content words inserted into Tagalog morphosyntax — produces exactly the low-confidence, split-posterior documents that floor is designed to remove.
        - paragraph [ref=f2e50]: "The consequence is a systematic register gap. The Filipino text that survives collection skews formal and monolingual: news copy, encyclopedic prose, official statements. The conversational register — the one with the code-switching in it — is thinned out at the point of collection, before any model sees it."
        - paragraph [ref=f2e51]: Tagalog Wikipedia is excluded here for the same reason, deliberately. It is clean, well-formed, and almost entirely free of the phenomenon under study.
    - generic [ref=f2e52]:
      - paragraph [ref=f2e53]: 02 — The scorer
      - heading "Lexicon-ratio scoring, and why the two lists are built differently" [level=2] [ref=f2e54]
      - paragraph [ref=f2e56]:
        - code [ref=f2e57]: score(text)
        - text: returns the fraction of word tokens matching each lexicon;
        - code [ref=f2e58]: is_taglish
        - text: keeps a document when both fractions clear a floor. No new dependencies, no model, and explainable in a paragraph — which matters, because this same function decides the training corpus, the ablation,
        - emphasis [ref=f2e59]: and
        - text: the headline metric.
      - heading "The two lists are not symmetric" [level=3] [ref=f2e60]
      - paragraph [ref=f2e61]:
        - text: The Tagalog list is almost all function words —
        - code [ref=f2e62]: ang
        - text: ","
        - code [ref=f2e63]: ng
        - text: ","
        - code [ref=f2e64]: sa
        - text: ","
        - code [ref=f2e65]: kasi
        - text: ","
        - code [ref=f2e66]: naman
        - text: ". Those are a closed class: you cannot write Tagalog syntax without them, and English text will not accidentally produce them."
      - paragraph [ref=f2e67]:
        - text: The English list deliberately includes content words —
        - code [ref=f2e68]: office
        - text: ","
        - code [ref=f2e69]: traffic
        - text: ","
        - code [ref=f2e70]: meeting
        - text: ". That asymmetry is forced by the phenomenon itself: in"
        - emphasis [ref=f2e71]: "\"nag-commute ako sa office\""
        - text: there is not a single English function word. Score English by function words and the most characteristically Taglish sentences read as pure Tagalog.
      - heading "Hyphens get split, or the most Taglish word scores nothing" [level=3] [ref=f2e72]
      - paragraph [ref=f2e73]:
        - code [ref=f2e74]: nag-commute
        - text: matches neither list as a single token — and neither does
        - code [ref=f2e75]: nagcommute
        - text: ", because the affix stripper only finds a stem that is itself in the Tagalog list, and"
        - code [ref=f2e76]: commute
        - text: is English. So the single most characteristically Taglish word in the sentence would contribute zero to either side.
      - paragraph [ref=f2e77]:
        - text: "Splitting on the hyphen fixes half of that:"
        - code [ref=f2e78]: commute
        - text: lands in the English list. The
        - code [ref=f2e79]: nag-
        - text: half still scores nothing, since bare affixes are not lexicon entries. That is a real limitation, not a design choice — but it only ever
        - emphasis [ref=f2e80]: under
        - text: "-counts, and it under-counts the Tagalog side of a word already surrounded by Tagalog function words, so the document is not at risk of being misread as English."
      - generic [ref=f2e81]:
        - paragraph [ref=f2e82]: Morphology
        - paragraph [ref=f2e83]:
          - text: "Tagalog is agglutinative:"
          - code [ref=f2e84]: trabaho
          - text: becomes
          - code [ref=f2e85]: nagtrabaho
          - text: ","
          - code [ref=f2e86]: trabahuhan
          - text: ","
          - code [ref=f2e87]: pinagtrabahuhan
          - text: . A bare root list misses all of those and under-counts the Tagalog side. The scorer peels one prefix and one suffix, and handles reduplication (
