      - paragraph [ref=f2e150]: The 512-token context is a deliberate choice for this subject. Code-switching is a discourse-level behaviour — a writer flips register across clauses and sentences, not within a three-word window. At 256 tokens the model would rarely see a full switch cycle.
      - generic [ref=f2e151]:
        - paragraph [ref=f2e152]: One tokenizer, trained on the unfiltered corpus
        - paragraph [ref=f2e153]:
          - text: Both arms share a byte-level BPE tokenizer, and it is trained on the
          - emphasis [ref=f2e154]: unfiltered
          - text: text on purpose. Training it on the filtered corpus would tune the vocabulary to the filtered model's own distribution and hand that arm an advantage that has nothing to do with the experiment. The two data-prep runs ran on two different accounts a day apart and produced byte-identical tokenizers, which is the check that this was actually deterministic rather than merely intended to be.
    - generic [ref=f2e155]:
      - paragraph [ref=f2e156]: 05 — Surviving the clock
      - heading "Crash-safe checkpointing, a wall-clock guard, and a chained runner across two accounts" [level=2] [ref=f2e157]
      - paragraph [ref=f2e158]: "Kaggle: ~30 GPU-h per week per account, hard 12-hour session wall. Four runs of ~10.9h each across two accounts. Every failure mode below actually fired at least once during this project."
      - heading "What makes an 11-hour run survivable" [level=3] [ref=f2e159]
      - list [ref=f2e160]:
        - listitem [ref=f2e161]:
          - text: Atomic checkpoints. Write to a temp file, then
          - code [ref=f2e162]: os.replace
          - text: onto the target, keeping the previous one as a fallback. A crash mid-write otherwise truncates the only copy you have.
        - listitem [ref=f2e163]: Random state is saved too. Without it, a resumed run replays the same batches it already learned from and quietly trains on a shorter corpus than you think.
        - listitem [ref=f2e164]:
          - text: A wall-clock guard. The loop stops itself at 11 hours and checkpoints cleanly, so
          - emphasis [ref=f2e165]: I
          - text: choose when the session ends rather than the platform choosing mid-write.
        - listitem [ref=f2e166]: A runner that assumes it will die. Re-running the entrypoint skips finished work and resumes partial work. It also detects the specific case where a run finished on the server but its output was never downloaded — which is what happens every time the laptop sleeps.
        - listitem [ref=f2e167]: A lockfile. Two runners once raced and pushed the same job 18 seconds apart, burning double the GPU on identical work.
      - paragraph [ref=f2e168]: "The last run made the case for all of it: it stopped at step 55,000 instead of 60,000. The runner noticed, pushed a continuation from the last checkpoint, finished the remaining 5,000 steps, and moved on to scoring — with nobody awake."
